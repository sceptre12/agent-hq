# Excerpt: the A.2.2 keys only (the part-04 section 5.8 fields are omitted here); comments name each value's source.
ports:
  bus_base: FILL_IN_BEFORE_DISPATCH              # human's machine choice; facts.md cannot-measure row
  lane_base: FILL_IN_BEFORE_DISPATCH
sensitive_paths: ['^\.github/workflows/']        # measured (find .github/workflows), human-confirmed, brief.md Q4
review_profile:
  mandatory_seats: []                            # human-answered, brief.md Q3
  blocking_rules: []                             # human-answered, brief.md Q3
zephyr:
  execute_tool: FILL_IN_BEFORE_DISPATCH          # no test-management tool named; brief.md open items
  read_ops: [FILL_IN_BEFORE_DISPATCH]
clones: [<PRIMARY_REPO>]                         # measured: facts.md row git rev-parse --show-cdup; no other clone, brief.md Q5
linked_profiles: []                              # single-repo epic, brief.md Q5
worktree_base: <DELIVERY_ROOT>/worktrees         # human-answered, brief.md Q2

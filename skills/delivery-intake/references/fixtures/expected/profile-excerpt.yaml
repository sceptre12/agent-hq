merge_reach: 'a merge to main deploys nothing'   # measured: facts.md rows sed -n '/^on:/,/^jobs:/p', grep -rliE 'deploy|publish|release', grep -i merge
ci:
  required_checks: [lint, typecheck, test]       # measured: ci.yml jobs; hosting-service list is cannot measure
  min_push_spacing_s: FILL_IN_BEFORE_DISPATCH
  max_open_pr_pipelines: FILL_IN_BEFORE_DISPATCH
merge_pipeline:
  stages: [lint, typecheck, test]                # measured: ci.yml jobs on push to main, file order (no needs:)
jira:
  status_map: FILL_IN_BEFORE_DISPATCH
  archive_status: FILL_IN_BEFORE_DISPATCH
secrets:
  pattern_file: FILL_IN_BEFORE_DISPATCH
gates:
  command: FILL_IN_BEFORE_DISPATCH               # no affected-capable runner; facts.md cannot-measure row
  parallel: FILL_IN_BEFORE_DISPATCH
  min_free_kb: FILL_IN_BEFORE_DISPATCH
  runner_slots: FILL_IN_BEFORE_DISPATCH
node:
  prefix_cmd: FILL_IN_BEFORE_DISPATCH
durations:
  pr_review_min: FILL_IN_BEFORE_DISPATCH
  ci_round_min: FILL_IN_BEFORE_DISPATCH
  unit_median_min: FILL_IN_BEFORE_DISPATCH
release_tags:
  used: "no"                                     # measured: git tag -l | wc -l -> 0, no release workflow

# hq code gate scope (architecture/hq-code-gate.md, Rule 10). One rule per line: "include|exclude <glob>".
# Globs use shell `case` matching, so `*` also crosses `/`. Exclude wins over include.
# `include mode:100755` puts any git-executable (100755) file in scope, e.g. extensionless hooks.
include *.sh
include *.bash
include *.zsh
include *.py
include *.js
include *.mjs
include *.cjs
include *.ts
include mode:100755
# The gate's own config is in scope (Fable T2 item 2): changing it on main needs a reviewed merge.
include tools/code-gate/*
exclude plans/*
exclude tools/swarm-communication-layer/*
exclude config/settings.json
# Vendored upstream tests (skills/security-audit/*.test.cjs): no shebang, mode 644, and vendored unmodified, so the runner
# cannot execute them directly (same mechanism as the swarm-bus exclusion above). They run through the mapped wrappers
# skills/security-audit/tests/test_validate-*.sh; the validators themselves stay in scope and mapped.
exclude skills/security-audit/*.test.cjs
